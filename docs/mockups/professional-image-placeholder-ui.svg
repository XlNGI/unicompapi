<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">专业生图项目图片虚位以待组件草图</title>
  <desc id="desc">深色 UniComp 风格的项目图片卡片，中央为虚线图片占位区域。</desc>
  <defs>
    <linearGradient id="placeholder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172231"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05080d" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#0b111a"/>
  <rect x="36" y="34" width="1128" height="652" rx="14" fill="#151e2b" stroke="#2a394c" filter="url(#shadow)"/>

  <rect x="36" y="34" width="1128" height="92" rx="14" fill="#182332"/>
  <path d="M36 126h1128" stroke="#2a394c"/>
  <text x="76" y="81" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27" font-weight="700">项目图片</text>
  <text x="76" y="108" fill="#91a0b4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">图生图的参考图片</text>

  <rect x="952" y="62" width="164" height="48" rx="8" fill="#24334a" stroke="#3b516d"/>
  <g transform="translate(978 76)" fill="none" stroke="#e8eef7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="3" width="20" height="17" rx="2"/>
    <path d="M4 16l4-4 4 3 3-3 5 5"/>
    <circle cx="15" cy="8" r="2"/>
  </g>
  <text x="1010" y="92" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">选择图片</text>

  <rect x="76" y="158" width="1048" height="420" rx="12" fill="url(#placeholder)" stroke="#41536b" stroke-width="2" stroke-dasharray="9 9"/>
  <rect x="562" y="330" width="76" height="76" rx="18" fill="#302c73" stroke="#5e54d9"/>
  <g transform="translate(600 368)" fill="none" stroke="#b8b1ff" stroke-width="5" stroke-linecap="round">
    <path d="M-17 0h34"/>
    <path d="M0-17v34"/>
  </g>

  <path d="M76 624h1048" stroke="#2a394c"/>
  <g transform="translate(76 646)" fill="none" stroke="#8e9db1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11h19"/>
    <path d="M14 2l9 9-9 9"/>
  </g>
  <text x="112" y="663" fill="#9eacbe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">支持点击选择或直接拖入图片</text>
</svg>
