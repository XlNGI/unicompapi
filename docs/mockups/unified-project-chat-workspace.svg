  </g>
  <g transform="translate(24 400)">
    <circle cx="11" cy="11" r="8" class="icon"/><path d="M11 7v8M7 11h8" class="icon"/>
    <text x="31" y="15" class="font nav">本地设置</text>
  </g>
  <rect x="12" y="780" width="196" height="92" rx="9" fill="#ffffff" stroke="#dfe5ee" filter="url(#shadow)"/>
