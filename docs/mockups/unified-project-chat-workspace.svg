  <text x="28" y="829" class="font tiny muted">全部项目占用</text><text x="176" y="829" text-anchor="end" class="font tiny">1.13 GB</text>
  <text x="28" y="849" class="font tiny muted">当前项目</text><text x="176" y="849" text-anchor="end" class="font tiny">正常</text>

  <!-- workspace sidebar -->
  <rect x="220" y="65" width="322" height="835" fill="#f8fafc"/>
  <line x1="542" y1="65" x2="542" y2="900" class="line"/>
  <text x="244" y="101" class="font title">项目工作台</text>
  <rect x="242" y="117" width="278" height="40" rx="8" fill="#5b4bd8"/>
  <path d="M260 137h16M268 129v16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="288" y="142" fill="#ffffff" class="font body" font-weight="600">新建对话</text>
  <rect x="242" y="171" width="278" height="34" rx="7" fill="#ffffff" stroke="#dfe5ee"/>
  <circle cx="261" cy="188" r="6" class="icon"/><path d="M266 193l5 5" class="icon"/>
  <text x="279" y="193" class="font small muted">搜索项目或对话</text>
  <text x="244" y="239" class="font label muted">项目</text>

