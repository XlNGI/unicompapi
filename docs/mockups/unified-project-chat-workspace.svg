<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>UniComp 项目与对话合并工作区效果图</title>
  <desc>桌面端浅色工作区，将项目列表和项目内对话历史合并到同一页面。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#17243a" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .muted { fill: #697586; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 15px; }
      .label { font-size: 13px; font-weight: 600; }
      .title { font-size: 19px; font-weight: 700; }
      .nav { font-size: 14px; }
      .line { stroke: #dfe5ee; stroke-width: 1; }
      .icon { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- top bar -->
  <rect width="1440" height="64" fill="#f8fafc"/>
  <line x1="0" y1="64" x2="1440" y2="64" class="line"/>
  <g transform="translate(24 17)">
    <path d="M2 2h18v25H2z" fill="none" stroke="#3f3f46" stroke-width="2" rx="3"/>
    <path d="M7 7c0 8 8 8 8 0M7 17c0 8 8 8 8 0" class="icon"/>
    <text x="34" y="19" class="font title">UniComp AI</text>
  </g>
  <rect x="218" y="13" width="216" height="38" rx="8" fill="#ffffff" stroke="#d4dce8"/>
  <path d="M236 26h15v12h-15zM239 23h9v3h-9z" class="icon"/>
  <text x="262" y="36" class="font small">所属项目：三大基本</text>
  <g transform="translate(1250 21)">
    <path d="M4 18h16M4 24h16M4 30h10" class="icon"/>
    <circle cx="13" cy="8" r="5" class="icon"/>
    <path d="M13 2v12M7 8h12" class="icon"/>
  </g>
  <text x="1302" y="37" class="font small muted">浅色</text>
  <path d="M1350 29l5 5 5-5" class="icon"/>
  <line x1="1390" y1="28" x2="1404" y2="28" class="icon"/>
  <rect x="1420" y="24" width="14" height="14" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- global navigation -->
  <rect x="0" y="65" width="220" height="835" fill="#f5f7fb"/>
  <line x1="220" y1="65" x2="220" y2="900" class="line"/>
  <text x="24" y="101" class="font label muted">工作区</text>
  <rect x="10" y="114" width="200" height="42" rx="8" fill="#ebe7ff" stroke="#cfc7ff"/>
  <path d="M28 128h15v13H28zM31 125h9v3h-9z" class="icon"/>
  <text x="55" y="140" class="font nav">项目工作台</text>
  <path d="M191 132l5 5-5 5" class="icon"/>
  <g transform="translate(24 180)">
    <path d="M1 2h17l2 3v13H1z" class="icon"/>
    <text x="31" y="15" class="font nav">图片创作</text>
    <path d="M168 7l5 5-5 5" class="icon"/>
  </g>
  <g transform="translate(24 224)">
    <path d="M2 3h17v17H2zM2 8h17" class="icon"/>
    <text x="31" y="15" class="font nav">视频创作</text>
    <path d="M168 7l5 5-5 5" class="icon"/>
  </g>
  <g transform="translate(24 268)">
    <path d="M4 5h2M4 11h2M4 17h2M10 5h11M10 11h11M10 17h11" class="icon"/>
    <text x="31" y="15" class="font nav">任务中心</text>
  </g>
  <g transform="translate(24 312)">
    <path d="M3 4h18v16H3zM7 8h10M7 13h10" class="icon"/>
