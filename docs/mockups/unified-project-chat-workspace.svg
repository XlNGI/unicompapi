  <rect x="258" y="429" width="246" height="38" rx="6" fill="#dfe6ff" stroke="#bac7ff"/>
  <path d="M274 442h13M274 448h13M274 454h9" class="icon"/>
  <text x="299" y="453" class="font small" font-weight="600">新对话</text>
