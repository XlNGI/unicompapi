  <rect x="242" y="517" width="278" height="42" rx="7" fill="#ffffff" stroke="#e1e6ee"/>
  <path d="M258 533h15l2 3v10h-17z" class="icon"/>
  <text x="286" y="543" class="font body">新产品发布</text>
  <path d="M493 530l5 5-5 5" class="icon"/>
  <rect x="242" y="567" width="278" height="42" rx="7" fill="#ffffff" stroke="#e1e6ee"/>
  <path d="M258 583h15l2 3v10h-17z" class="icon"/>
  <text x="286" y="593" class="font body">设计研究</text>
  <path d="M493 580l5 5-5 5" class="icon"/>
  <line x1="242" y1="639" x2="520" y2="639" class="line"/>
  <text x="244" y="670" class="font small muted">项目操作</text>
  <text x="265" y="708" class="font small">管理项目</text>
  <text x="265" y="743" class="font small">打开本地项目</text>
  <text x="265" y="778" class="font small">新建项目</text>
  <path d="M494 700l5 5-5 5M494 735l5 5-5 5M494 770l5 5-5 5" class="icon"/>

  <!-- chat area -->
  <rect x="542" y="65" width="898" height="835" fill="#ffffff"/>
  <line x1="542" y1="128" x2="1440" y2="128" class="line"/>
  <text x="576" y="101" class="font title">市场分析与定位</text>
  <rect x="760" y="82" width="112" height="26" rx="13" fill="#f1efff"/>
  <text x="816" y="100" text-anchor="middle" class="font tiny" fill="#5146b8">项目：三大基本</text>
  <g transform="translate(1310 88)">
    <path d="M2 9h16M2 15h16M2 21h10" class="icon"/>
    <path d="M39 8h17v14H39zM43 5h9v3h-9z" class="icon"/>
    <circle cx="78" cy="15" r="8" class="icon"/>
    <path d="M78 11v8M74 15h8" class="icon"/>
  </g>
  <text x="576" y="173" class="font tiny muted">今天 09:42</text>
  <rect x="576" y="190" width="584" height="67" rx="10" fill="#f5f7fb"/>
  <text x="598" y="218" class="font body">请基于当前项目资料，整理目标用户、竞品差异和产品定位。</text>
  <text x="598" y="241" class="font small muted">已引用：项目资料 3 份</text>
  <circle cx="1178" cy="223" r="17" fill="#ebe7ff"/>
  <text x="1178" y="229" text-anchor="middle" class="font tiny" fill="#5146b8">你</text>
  <rect x="576" y="292" width="646" height="152" rx="10" fill="#ffffff" stroke="#e4e8ef" filter="url(#shadow)"/>
  <text x="598" y="322" class="font body" font-weight="600">市场分析初稿</text>
  <text x="598" y="351" class="font body">我先按三个维度整理：</text>
  <text x="598" y="379" class="font body">1. 目标用户：中小企业内容团队与产品负责人</text>
  <text x="598" y="407" class="font body">2. 竞品差异：本地资料优先、可追溯的交付流程</text>
  <text x="598" y="435" class="font body">3. 产品定位：面向企业知识工作的本地 AI 工作台</text>
  <text x="576" y="481" class="font tiny muted">回复已完成 · 09:43</text>

  <!-- contextual suggestion -->
  <rect x="576" y="522" width="646" height="62" rx="9" fill="#fbfbfd" stroke="#e4e8ef"/>
  <path d="M598 543h16v16h-16zM602 539h8v4h-8z" class="icon"/>
  <text x="626" y="547" class="font small" font-weight="600">项目上下文已就绪</text>
  <text x="626" y="568" class="font tiny muted">可从右上角查看已登记资料和引用范围</text>
  <path d="M1191 546l6 6-6 6" class="icon"/>

  <!-- composer -->
  <rect x="576" y="734" width="776" height="108" rx="12" fill="#ffffff" stroke="#ccd5e2" filter="url(#shadow)"/>
  <text x="600" y="769" class="font body muted">输入问题或任务，可拖入图片、文档或电子书</text>
  <path d="M601 807h14M608 800v14" class="icon"/>
  <text x="632" y="813" class="font small muted">添加附件</text>
  <rect x="1124" y="791" width="82" height="30" rx="15" fill="#f1efff"/>
  <text x="1165" y="811" text-anchor="middle" class="font tiny" fill="#5146b8">普通</text>
  <path d="M1217 803l4 4 4-4" class="icon"/>
  <circle cx="1309" cy="803" r="19" fill="#e3e8f0"/>
  <path d="M1302 803h14M1309 796v14" stroke="#8a96a8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- bottom status -->
  <rect x="542" y="861" width="898" height="39" fill="#f8fafc"/>
  <line x1="542" y1="861" x2="1440" y2="861" class="line"/>
  <text x="576" y="886" class="font tiny muted">当前场景：项目工作台 · 对话</text>
  <text x="1218" y="886" class="font tiny muted">任务中心 0</text>
  <text x="1310" y="886" class="font tiny muted">作品库 12</text>
</svg>
